[package]
name = "duet"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A TUI for running claude and codex in named, persistent tabs with agent-switch handoff"
repository = "https://github.com/devfernandoa/duet"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
vte4 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
