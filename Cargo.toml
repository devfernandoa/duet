[package]
name = "duet"
version = "1.0.1"
edition = "2024"
license = "MIT"
description = "A GTK4 desktop app for running and orchestrating multiple AI coding agents on a persistent canvas"
repository = "https://github.com/devfernandoa/duet"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sourceview5 = "0.11"
uuid = { version = "1.26.1", features = ["serde", "v4", "v5"] }
vte4 = "0.10"
webkit6 = { version = "0.6", features = ["v2_42"] }

[dev-dependencies]
tempfile = "3.27.0"
