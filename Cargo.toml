[package]
name = "duet"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A TUI for running claude and codex in named, persistent tabs with agent-switch handoff"
repository = "https://github.com/devfernandoa/duet"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tui-term = "0.3.4"
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
